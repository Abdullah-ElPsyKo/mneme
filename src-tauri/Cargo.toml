[package]
name = "mneme-desktop"
version = "0.2.3"
description = "Mneme — a local home for your memory"
authors = ["Mneme contributors"]
edition = "2021"
rust-version = "1.85"
default-run = "Mneme"

[[bin]]
name = "Mneme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
